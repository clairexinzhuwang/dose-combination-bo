[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dose-combination-bo"
version = "0.2.1rc5"
description = "Bayesian optimization for combination dose finding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Xinzhu Wang", email = "xinzhu_wang@urmc.rochester.edu" },
]
keywords = [
    "combination dose-finding", "active learning", "level-set estimation",
    "Bayesian optimization", "knowledge gradient", "constrained optimization",
    "simulation study", "operating characteristics", "final dose recommendation",
    "participant allocation",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "gpytorch>=1.11",
    "zstandard>=0.19",
]

[project.optional-dependencies]
parallel = ["ray>=2.0"]
tables = ["pandas>=2.0"]
dev = ["pytest>=7.0", "ray>=2.0", "pandas>=2.0", "matplotlib>=3.7"]
figures = ["matplotlib>=3.7"]

[project.scripts]
dose-combination-bo = "dose_combination_bo.cli:main"

[project.urls]
Homepage = "https://github.com/clairexinzhuwang/dose-combination-bo"
Repository = "https://github.com/clairexinzhuwang/dose-combination-bo"
Documentation = "https://github.com/clairexinzhuwang/dose-combination-bo#readme"
Paper = "https://doi.org/10.48550/arXiv.2610.09245"
Issues = "https://github.com/clairexinzhuwang/dose-combination-bo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "ray: requires a local Ray runtime and process-inspection permissions",
]
